# Ambiente de desenvolvimento: Elasticsearch + API/interface (sem segurança; não use assim em produção)
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: grimorio-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      # Só a sua máquina acessa. Sem o 127.0.0.1, qualquer pessoa na sua rede
      # alcançaria um Elasticsearch sem senha.
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  web:
    image: python:3.11-slim
    container_name: grimorio-fastapi
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - ES_URL=http://elasticsearch:9200
      - ES_INDEX=spells-2024-pt
    volumes:
      - .:/app            # a pasta do projeto fica visível dentro do container
    working_dir: /app
    # Lista (em vez de texto único) evita problemas de aspas no shell.
    # elastic_transport já vem junto com o pacote elasticsearch.
    command:
      - sh
      - -c
      - pip install fastapi "uvicorn[standard]" "elasticsearch>=8.13,<9" && uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - elasticsearch

volumes:
  esdata: